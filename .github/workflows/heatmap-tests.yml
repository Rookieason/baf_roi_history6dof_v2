name: Heatmap software validation
on:
  push:
    branches: ['feature/csi-heatmap-fusion']
    paths-ignore: ['docs/**', 'README*.md']
  pull_request:
    paths-ignore: ['docs/**', 'README*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-heatmap.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-heatmap.txt
      - name: Preserve source snapshot
        if: always()
        run: git archive --format=zip --output=heatmap-source.zip HEAD
      - name: Baseline provenance audit
        run: python -m baf_roi audit
      - name: Unit and regression tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-result.txt
      - name: Synthetic end-to-end validation
        run: |
          set -o pipefail
          python scripts/smoke_heatmap.py --output /tmp/heatmap-smoke 2>&1 | tee smoke-result.txt
      - name: Upload reproducible source and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-validation
          retention-days: 14
          path: |
            heatmap-source.zip
            pytest-result.txt
            smoke-result.txt
            /tmp/heatmap-smoke/smoke_result.json
            /tmp/heatmap-smoke/benchmark.json
